server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: payment-generator

spring:
  application:
    name: payment-generator
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payflow_oltp}
    username: ${SPRING_DATASOURCE_USERNAME:payflow_app}
    password: ${SPRING_DATASOURCE_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: PayflowHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

simulation:
  enabled: ${SIMULATION_ENABLED:true}
  random-seed: 2026
  payment:
    transactions-per-second: 5
    min-amount: 10000
    max-amount: 5000000
  probabilities:
    authorization-success: 0.85
    capture-success: 0.95
    refund: 0.02
    chargeback: 0.005
    settlement-mismatch: 0.01
    duplicate-settlement: 0.002
  schedules:
    payment-generation-ms: 1000
    lifecycle-transition-ms: 2000
    refund-generation-ms: 10000
    settlement-generation-ms: 60000
