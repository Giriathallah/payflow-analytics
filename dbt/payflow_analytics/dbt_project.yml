name: 'payflow_analytics'
version: '1.0.0'
config-version: 2

profile: 'payflow_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  payflow_analytics:
    staging:
      +schema: payflow_core
      +materialized: view
    intermediate:
      +schema: payflow_core
      +materialized: view
    marts:
      +schema: payflow_mart
      +materialized: table
      +engine: MergeTree()
