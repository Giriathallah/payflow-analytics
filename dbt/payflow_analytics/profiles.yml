payflow_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: payflow_mart
      host: "{{ env_var('DBT_CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('DBT_CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('DBT_CLICKHOUSE_USER', 'dbt_transformer') }}"
      password: "{{ env_var('DBT_CLICKHOUSE_PASSWORD', 'dbt_transformer_pass') }}"
      secure: false
      verify: false
